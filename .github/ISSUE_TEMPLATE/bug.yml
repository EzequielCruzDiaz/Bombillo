name: Error
description: Algo no funciona como debería
labels: ["tipo:bug"]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Qué esperabas y qué ocurrió.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abrir el escenario…\n2. Tocar el circuito…"
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Dispositivo y navegador
      placeholder: "Android 14, Chrome"
